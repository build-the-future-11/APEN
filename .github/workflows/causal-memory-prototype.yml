name: APEN successor causal-memory unit contract

on:
  pull_request:
    paths:
      - "apen_event_residual/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/causal-memory-prototype.yml"

permissions:
  contents: read

jobs:
  causal-memory-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install prospective prototype
        run: python -m pip install -e ".[dev]"
      - name: Test only causal-memory engineering contracts
        run: python -m pytest -q -W error tests/
      - name: Explicit scientific scope
        run: echo "No protected APEN experiment or historical negative study is reopened."
